name: Test

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

concurrency:
  group: "test-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and project tools
        id: mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true

      - name: Get Home Assistant version
        id: ha_version
        run: |
          HA_VERSION=$(grep '"homeassistant"' hacs.json | head -1 | sed 's/.*"homeassistant"\s*:\s*"\([^"]*\)".*/\1/')
          echo "HA_VERSION=${HA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Home Assistant version: ${HA_VERSION}"

      - name: Cache Home Assistant installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/ha-venv
          key: "ha-venv-${{ runner.os }}-py${{ steps.mise.outputs.python }}-uv${{ steps.mise.outputs.uv }}-ha${{ steps.ha_version.outputs.HA_VERSION }}-${{ hashFiles('**/requirements*.txt') }}"
          restore-keys: |
            ha-venv-${{ runner.os }}-py${{ steps.mise.outputs.python }}-uv${{ steps.mise.outputs.uv }}-ha${{ steps.ha_version.outputs.HA_VERSION }}-

      - name: Bootstrap test environment
        run: script/setup/bootstrap

      - name: Run test suite
        run: script/test
