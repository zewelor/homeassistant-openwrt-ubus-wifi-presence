name: Debug Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.4"
          args: format custom_components/openwrt_ubus/binary_sensor/__init__.py tests/test_binary_sensor.py
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/openwrt_ubus/binary_sensor/__init__.py tests/test_binary_sensor.py
          git commit -m "style: format simplified WiFi SSID cleanup"
          git push
