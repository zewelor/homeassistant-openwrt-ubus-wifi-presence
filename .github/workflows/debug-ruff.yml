name: Debug Ruff

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  ruff-format:
    name: Ruff format diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.4"
          args: format custom_components/ tests/ --check

  ruff-check:
    name: Ruff lint diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Ruff lint check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.4"
          args: check custom_components/ tests/
