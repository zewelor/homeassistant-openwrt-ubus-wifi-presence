name: Debug Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    name: Apply Ruff formatting
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Format changed Python files
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.4"
          args: format custom_components/openwrt_ubus/binary_sensor/__init__.py tests/test_binary_sensor.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/openwrt_ubus/binary_sensor/__init__.py tests/test_binary_sensor.py
          git commit -m "style: format WiFi SSID sensor changes"
          git push
