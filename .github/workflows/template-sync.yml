---
# Propose blueprint changes on one branch without overwriting project-owned files.
name: Sync from Blueprint Template

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  template-sync:
    name: Sync from template
    if: github.repository != 'jpawlowski/hacs.integration_blueprint'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TARGET_PAT || github.token }}
      TEMPLATE_SYNC_TARGET_PAT: ${{ secrets.TEMPLATE_SYNC_TARGET_PAT }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted sync tools
        run: |
          cp .templatesyncignore "$RUNNER_TEMP/template-sync-ignore"
          cp script/template-sync-branch "$RUNNER_TEMP/template-sync-branch"
          cp script/.lib/template_sync_prepare.py "$RUNNER_TEMP/template-sync-prepare.py"
          echo "TEMPLATE_SYNC_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -z "$TEMPLATE_SYNC_TARGET_PAT" ]]; then
            {
              echo "### Template sync notice"
              echo
              echo "A PR created with GITHUB_TOKEN may require workflow approval before CI runs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare the sync branch
        run: bash "$RUNNER_TEMP/template-sync-branch" prepare

      - name: Fetch blueprint
        run: |
          git fetch --no-tags https://github.com/jpawlowski/hacs.integration_blueprint.git refs/heads/main
          echo "TEMPLATE_SYNC_SOURCE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Apply blueprint changes
        run: python3 -I "$RUNNER_TEMP/template-sync-prepare.py" "$TEMPLATE_SYNC_SOURCE_SHA" "$RUNNER_TEMP/template-sync-ignore"

      - name: Publish the sync proposal
        run: bash "$RUNNER_TEMP/template-sync-branch" publish "$TEMPLATE_SYNC_SOURCE_SHA"
